<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="SupportAI Create Ticket - Submit a new support request with AI-powered assistance.">
    <title>SupportAI - Create New Ticket</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ===== Reset & Base ===== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* ===== Sidebar ===== */
        .sidebar {
            width: 240px;
            min-height: 100vh;
            background: linear-gradient(180deg, #0f1a2e 0%, #162038 100%);
            display: flex;
            flex-direction: column;
            padding: 28px 0;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            z-index: 100;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 24px;
            margin-bottom: 36px;
        }

        .sidebar-brand svg {
            width: 34px;
            height: 34px;
            flex-shrink: 0;
        }

        .sidebar-brand-name {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.02em;
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex: 1;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 24px;
            font-size: 14px;
            font-weight: 500;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
        }

        .nav-item:hover {
            color: #e2e8f0;
            background: rgba(255, 255, 255, 0.04);
        }

        .nav-item.active {
            color: #ffffff;
            background: rgba(72, 128, 232, 0.15);
            border-left-color: #4880e8;
        }

        .nav-item svg {
            width: 19px;
            height: 19px;
            flex-shrink: 0;
        }

        .sidebar-footer {
            padding: 0 24px;
            margin-top: auto;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .nav-item.logout {
            color: #ef4444;
            opacity: 0.8;
        }

        .nav-item.logout:hover {
            opacity: 1;
            background: rgba(239, 68, 68, 0.08);
        }

        /* ===== Main Content ===== */
        .main-content {
            margin-left: 240px;
            flex: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== Top Bar ===== */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 18px 32px;
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 10px;
            transition: background 0.2s ease;
        }

        .user-profile:hover {
            background: #f1f5f9;
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4880e8, #6c5ce7);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
        }

        .user-name {
            font-size: 14px;
            font-weight: 600;
            color: #1e293b;
        }

        /* ===== Page Content ===== */
        .page-content {
            padding: 32px;
            flex: 1;
            max-width: 1000px;
        }

        .page-title {
            font-size: 24px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 6px;
        }

        .page-subtitle {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 28px;
        }

        /* ===== Ticket Form Card ===== */
        .form-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04), 0 6px 24px rgba(15, 23, 42, 0.03);
            padding: 32px;
            border: 1px solid #e2e8f0;
        }

        .form-grid {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label {
            font-size: 13.5px;
            font-weight: 600;
            color: #334155;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .form-label .required {
            color: #ef4444;
        }

        .form-control,
        .form-select {
            width: 100%;
            padding: 12px 16px;
            font-size: 14px;
            font-family: inherit;
            color: #0f172a;
            background-color: #f8fafc;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-control:focus,
        .form-select:focus {
            background-color: #ffffff;
            border-color: #4880e8;
            box-shadow: 0 0 0 4px rgba(72, 128, 232, 0.15);
        }

        .form-control::placeholder {
            color: #94a3b8;
        }

        textarea.form-control {
            resize: vertical;
            min-height: 130px;
            line-height: 1.6;
        }

        /* ===== Priority Selector ===== */
        .priority-options {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .priority-radio {
            display: none;
        }

        .priority-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 11px 14px;
            border-radius: 10px;
            border: 1.5px solid #e2e8f0;
            background: #f8fafc;
            color: #475569;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .priority-btn:hover {
            border-color: #cbd5e1;
            background: #f1f5f9;
        }

        .priority-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .priority-radio:checked+.priority-btn.low {
            border-color: #22c55e;
            background: #f0fdf4;
            color: #16a34a;
        }

        .priority-radio:checked+.priority-btn.low .priority-dot {
            background: #16a34a;
        }

        .priority-radio:checked+.priority-btn.medium {
            border-color: #f59e0b;
            background: #fffbeb;
            color: #d97706;
        }

        .priority-radio:checked+.priority-btn.medium .priority-dot {
            background: #d97706;
        }

        .priority-radio:checked+.priority-btn.high {
            border-color: #ef4444;
            background: #fef2f2;
            color: #dc2626;
        }

        .priority-radio:checked+.priority-btn.high .priority-dot {
            background: #dc2626;
        }

        .priority-radio:checked+.priority-btn.urgent {
            border-color: #7c3aed;
            background: #f5f3ff;
            color: #6d28d9;
        }

        .priority-radio:checked+.priority-btn.urgent .priority-dot {
            background: #6d28d9;
        }

        /* ===== File Upload Zone ===== */
        .file-dropzone {
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 28px;
            text-align: center;
            background: #f8fafc;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .file-dropzone:hover,
        .file-dropzone.dragover {
            border-color: #4880e8;
            background: rgba(72, 128, 232, 0.03);
        }

        .file-dropzone svg {
            width: 40px;
            height: 40px;
            color: #64748b;
            margin-bottom: 10px;
        }

        .file-dropzone-text {
            font-size: 14px;
            color: #334155;
            font-weight: 500;
        }

        .file-dropzone-text span {
            color: #4880e8;
            font-weight: 600;
        }

        .file-dropzone-hint {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 4px;
        }

        .file-input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .selected-file-name {
            margin-top: 10px;
            font-size: 13px;
            font-weight: 600;
            color: #2563eb;
        }

        /* ===== AI Assistance Box ===== */
        .ai-assistant-card {
            background: linear-gradient(135deg, rgba(72, 128, 232, 0.06) 0%, rgba(108, 92, 231, 0.06) 100%);
            border: 1px solid rgba(72, 128, 232, 0.2);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            align-items: flex-start;
            gap: 14px;
        }

        .ai-badge-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: linear-gradient(135deg, #4880e8, #6c5ce7);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: #ffffff;
        }

        .ai-assistant-content {
            flex: 1;
        }

        .ai-assistant-title {
            font-size: 13.5px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ai-assistant-desc {
            font-size: 12.5px;
            color: #475569;
            line-height: 1.5;
        }

        /* ===== Form Actions ===== */
        .form-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 14px;
            margin-top: 12px;
            padding-top: 24px;
            border-top: 1px solid #f1f5f9;
        }

        .btn {
            padding: 12px 26px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4880e8 0%, #3b6fd4 100%);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(72, 128, 232, 0.25);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(72, 128, 232, 0.35);
        }

        .btn-secondary {
            background: #ffffff;
            color: #64748b;
            border: 1.5px solid #cbd5e1;
        }

        .btn-secondary:hover {
            background: #f8fafc;
            color: #334155;
            border-color: #94a3b8;
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #0f172a;
            color: #ffffff;
            padding: 14px 22px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 10px;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1000;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* ===== Responsive ===== */
        @media (max-width: 768px) {
            .sidebar {
                width: 70px;
                padding: 20px 0;
            }

            .sidebar-brand-name,
            .nav-item span {
                display: none;
            }

            .sidebar-brand {
                justify-content: center;
                padding: 0;
            }

            .nav-item {
                justify-content: center;
                padding: 12px;
                border-left: none;
            }

            .nav-item.active {
                border-left: none;
                border-radius: 8px;
                margin: 0 8px;
            }

            .sidebar-footer {
                padding: 0 8px;
            }

            .main-content {
                margin-left: 70px;
            }

            .page-content {
                padding: 20px 16px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .priority-options {
                grid-template-columns: repeat(2, 1fr);
            }

            .form-card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <!-- ===== Sidebar ===== -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <!-- SupportAI Logo -->
            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M32 8C19.85 8 10 16.28 10 26.5C10 32.18 13.12 37.22 18 40.56V52L27.2 44.36C28.76 44.6 30.36 44.74 32 44.74C44.15 44.74 54 36.72 54 26.5C54 16.28 44.15 8 32 8Z"
                    fill="#4880e8" />
                <circle cx="23" cy="27" r="3.5" fill="#ffffff" />
                <circle cx="33" cy="27" r="3.5" fill="#ffffff" />
                <circle cx="43" cy="27" r="3.5" fill="#ffffff" />
                <circle cx="32" cy="6" r="3" fill="#4880e8" />
                <line x1="32" y1="9" x2="32" y2="14" stroke="#4880e8" stroke-width="2.5" stroke-linecap="round" />
            </svg>
            <span class="sidebar-brand-name">SupportAI</span>
        </div>

        <nav class="sidebar-nav">
            <!-- Dashboard -->
            <a href="customer_dashboard.html" class="nav-item" id="nav-dashboard">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7" rx="1" />
                    <rect x="14" y="3" width="7" height="7" rx="1" />
                    <rect x="3" y="14" width="7" height="7" rx="1" />
                    <rect x="14" y="14" width="7" height="7" rx="1" />
                </svg>
                <span>Dashboard</span>
            </a>

            <!-- My Tickets -->
            <a href="customer_dashboard.html" class="nav-item" id="nav-my-tickets">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                    <polyline points="14 2 14 8 20 8" />
                    <line x1="16" y1="13" x2="8" y2="13" />
                    <line x1="16" y1="17" x2="8" y2="17" />
                    <polyline points="10 9 9 9 8 9" />
                </svg>
                <span>My Tickets</span>
            </a>

            <!-- Create Ticket -->
            <a href="create_ticket.html" class="nav-item active" id="nav-create-ticket">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19" />
                    <line x1="5" y1="12" x2="19" y2="12" />
                </svg>
                <span>Create Ticket</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <a href="../../login.html" class="nav-item logout" id="nav-logout">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                    <polyline points="16 17 21 12 16 7" />
                    <line x1="21" y1="12" x2="9" y2="12" />
                </svg>
                <span>Logout</span>
            </a>
        </div>
    </aside>

    <!-- ===== Main Content ===== -->
    <main class="main-content">

        <!-- Top Bar -->
        <header class="top-bar" id="top-bar">
            <div class="user-profile" id="user-profile">
                <div class="user-avatar">S</div>
                <span class="user-name">Shivam</span>
            </div>
        </header>

        <!-- Page Content -->
        <section class="page-content">
            <h1 class="page-title">Create Support Ticket</h1>
            <p class="page-subtitle">fill in the details below and we'll get back to you as soon as possible. </p>

            <!-- Ticket Form -->
            <div class="form-card">
                <form id="create-ticket-form" onsubmit="handleTicketSubmit(event)">
                    <div class="form-grid">

                        <!-- Form Row 1: Category & Priority -->
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label" for="ticket-category">Category <span
                                        class="required">*</span></label>
                                <select id="ticket-category" class="form-select" required>
                                    <option value="" disabled selected>Select category...</option>
                                    <option value="technical">Technical Issue</option>
                                    <option value="billing">Billing & Subscription</option>
                                    <option value="account">Account & Security</option>
                                    <option value="feature">Feature Request</option>
                                    <option value="other">General Inquiry</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label class="form-label">Priority Level <span class="required">*</span></label>
                                <div class="priority-options">
                                    <label>
                                        <input type="radio" name="priority" value="low" class="priority-radio">
                                        <div class="priority-btn low">
                                            <span class="priority-dot"></span> Low
                                        </div>
                                    </label>
                                    <label>
                                        <input type="radio" name="priority" value="medium" class="priority-radio"
                                            checked>
                                        <div class="priority-btn medium">
                                            <span class="priority-dot"></span> Medium
                                        </div>
                                    </label>
                                    <label>
                                        <input type="radio" name="priority" value="high" class="priority-radio">
                                        <div class="priority-btn high">
                                            <span class="priority-dot"></span> High
                                        </div>
                                    </label>
                                    <label>
                                        <input type="radio" name="priority" value="urgent" class="priority-radio">
                                        <div class="priority-btn urgent">
                                            <span class="priority-dot"></span> Urgent
                                        </div>
                                    </label>
                                </div>
                            </div>
                        </div>

                        <!-- Subject -->
                        <div class="form-group">
                            <label class="form-label" for="ticket-subject">Subject <span
                                    class="required">*</span></label>
                            <input type="text" id="ticket-subject" class="form-control"
                                placeholder="e.g. Unable to connect to database API" required>
                        </div>

                        <!-- Description -->
                        <div class="form-group">
                            <label class="form-label" for="ticket-description">Detailed Description <span
                                    class="required">*</span></label>
                            <textarea id="ticket-description" class="form-control"
                                placeholder="Please describe your issue, steps to reproduce, or error messages encountered..."
                                required></textarea>
                        </div>

                        <!-- Form Actions -->
                        <div class="form-actions">
                            <a href="customer_dashboard.html" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <line x1="22" y1="2" x2="11" y2="13"></line>
                                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                                </svg>
                                Submit Ticket
                            </button>
                        </div>

                    </div>
                </form>
            </div>
        </section>
    </main>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#22c55e"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
        <span id="toast-message">Ticket created successfully! Redirecting...</span>
    </div>

    <script>
        function handleTicketSubmit(event) {
            event.preventDefault();
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => {
                window.location.href = 'customer_dashboard.html';
            }, 1800);
        }
    </script>

</body>

</html>
